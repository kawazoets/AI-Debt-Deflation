name: US debt deflation research
on:
  push:
    paths:
      - research.py
      - .github/workflows/research.yml
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'
permissions:
  contents: write
concurrency:
  group: research
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas matplotlib
      - run: python research.py
      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data charts
          git diff --cached --quiet || git commit -m "Refresh US economic data and charts"
          git push
